GPU: [0,1,2,3]

VERBOSE: True

MODEL:
  MODE: 'Deblurring'
  SESSION: 'TRM-UNet'

# Optimization arguments.
OPTIM:
  BATCH_SIZE: 4
  NUM_EPOCHS: 200
  # NEPOCH_DECAY: [10]
  LR_INITIAL: 2e-4
  LR_MIN: 1e-6
  # BETA1: 0.9

TRAINING:
  VAL_AFTER_EVERY: 1
  RESUME: False
  TRAIN_PS: 512
  VAL_PS: 512
#  TRAIN_DIR: '/media/6T/GOPRO_Large_all' # path to training data
#  VAL_DIR: '/media/6T/GOPRO_Large_all'    # path to validation data
  SAVE_DIR: './TRM-UNet-512'     # path to save models and images
  # SAVE_IMAGES: False
